<script>
  (function () {
    const amountEl = document.getElementById('amount-val');
    const saveBtnLabel = document.getElementById('save-btn-label');
    const keypad = document.getElementById('keypad');
    let currentRaw = '2340';

    function updateDisplay() {
      const parsed = parseFloat(currentRaw || '0');
      const formatted = currentRaw.includes('.') 
        ? currentRaw 
        : Number(currentRaw || 0).toLocaleString('en-IN');
      
      amountEl.textContent = formatted || '0';
      saveBtnLabel.textContent = `Save Expense (₹${formatted || '0'})`;
    }

    if (keypad) {
      keypad.addEventListener('click', (e) => {
        const btn = e.target.closest('.keypad-key');
        if (!btn) return;
        const key = btn.getAttribute('data-key');

        if (key === 'backspace') {
          currentRaw = currentRaw.slice(0, -1);
        } else if (key === '.') {
          if (!currentRaw.includes('.')) {
            currentRaw = currentRaw === '' ? '0.' : currentRaw + '.';
          }
        } else if (key) {
          if (currentRaw === '0') {
            currentRaw = key;
          } else if (currentRaw.length < 9) {
            currentRaw += key;
          }
        }
        updateDisplay();
      });
    }

    // Segmented tab toggle
    const tabs = [
      document.getElementById('type-expense'),
      document.getElementById('type-income'),
      document.getElementById('type-transfer')
    ];

    tabs.forEach(tab => {
      if (!tab) return;
      tab.addEventListener('click', () => {
        tabs.forEach(t => {
          t.setAttribute('aria-selected', 'false');
          t.className = 'h-10 rounded-lg text-on-surface-variant hover:text-on-surface font-label-lg text-label-lg flex items-center justify-center transition';
        });
        tab.setAttribute('aria-selected', 'true');
        tab.className = 'h-10 rounded-lg bg-surface-container-lowest text-primary font-label-lg text-label-lg shadow-sm flex items-center justify-center transition';
      });
    });
  })();
